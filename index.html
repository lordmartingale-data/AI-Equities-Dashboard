<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Capex flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:    #12161f;
    --panel:  #171c27;
    --box:    #1b212e;
    --line:   #262d3b;
    --line-2: #333c4d;
    --text:   #e4e7ed;
    --dim:    #78829a;
    --dimmer: #4d566b;
    --up:     #7fb069;
    --down:   #c97064;
    --sand:   #d9c89e;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'IBM Plex Sans', system-ui, -apple-system, sans-serif;
    --disp: 'Space Grotesk', var(--sans);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    padding: 26px 20px 64px;
  }

  .wrap { max-width: 1320px; margin: 0 auto; }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 20px;
    padding-bottom: 13px;
    border-bottom: 1px solid var(--line-2);
  }

  h1 {
    font-family: var(--disp);
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
  }

  .sub {
    font-family: var(--sans);
    font-size: 12px;
    color: var(--dim);
  }

  .stamp {
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--dim);
    margin-left: auto;
  }
  .stamp b { color: var(--text); font-weight: 500; }

  h2 {
    font-family: var(--disp);
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--dim);
    margin: 34px 0 2px;
  }

  .h2note {
    font-size: 11.5px;
    color: var(--dimmer);
    margin-bottom: 14px;
  }

  /* ------------------------------------------------------------ umbrella */

  #umbrella { overflow-x: auto; padding-bottom: 6px; }
  #umbrella svg { display: block; }

  .node-box    { fill: var(--box); stroke: var(--line-2); }
  .node-box.rt { fill: #1f2634;    stroke: var(--sand);   stroke-opacity: .5; }
  .node-title  { font-family: var(--disp); font-size: 11px; font-weight: 600;
                 fill: var(--text); letter-spacing: .04em; }
  .node-sub    { font-family: var(--sans); font-size: 9px; fill: var(--dimmer); }
  .chip-sym    { font-family: var(--mono); font-size: 11px; font-weight: 600; fill: var(--text); }
  .chip-pct    { font-family: var(--mono); font-size: 10px; }
  .edge        { stroke: var(--line-2); fill: none; }

  /* ---------------------------------------------------------------- table */

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--dim);
    margin-bottom: 10px;
    flex-wrap: wrap;
  }

  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 3px; overflow: hidden; }
  .seg button {
    font-family: var(--mono);
    font-size: 11px;
    background: transparent;
    color: var(--dim);
    border: 0;
    border-right: 1px solid var(--line-2);
    padding: 4px 9px;
    cursor: pointer;
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--sand); color: #12161f; font-weight: 600; }
  .seg button:focus-visible { outline: 1px solid var(--sand); outline-offset: -2px; }

  .scroller { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse;
          font-family: var(--mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  thead th {
    font-family: var(--sans);
    font-size: 10.5px; font-weight: 500;
    text-transform: uppercase; letter-spacing: .07em;
    color: var(--dim); text-align: right;
    padding: 0 9px 7px; white-space: nowrap;
    border-bottom: 1px solid var(--line-2);
    cursor: pointer; user-select: none;
  }
  thead th:first-child { text-align: left; padding-left: 2px; }
  thead th.plain { cursor: default; }
  thead th:hover:not(.plain) { color: var(--text); }
  thead th:focus-visible { outline: 1px solid var(--sand); outline-offset: 2px; }
  thead th .arrow { color: var(--sand); font-size: 9px; margin-left: 3px; }

  tbody tr.grp td {
    font-family: var(--disp); font-size: 9.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .13em;
    color: var(--dimmer); text-align: left;
    padding: 16px 2px 5px; border-bottom: 1px solid var(--line);
  }

  tbody tr.row { border-bottom: 1px solid var(--line); }
  tbody tr.row:hover { background: var(--panel); }
  tbody td { padding: 8px 9px; text-align: right; white-space: nowrap; }

  td.sym { text-align: left; padding-left: 2px; position: sticky; left: 0; background: var(--ink); }
  tbody tr.row:hover td.sym { background: var(--panel); }
  tbody tr.grp td { background: var(--ink); }

  .ticker { font-weight: 600; font-size: 13px; }
  .co { display: block; font-family: var(--sans); font-size: 10.5px;
        color: var(--dimmer); margin-top: 1px; }
  .fx { color: var(--dimmer); font-size: 10px; }

  .up { color: var(--up); } .down { color: var(--down); } .na { color: var(--dimmer); }
  .rel { font-weight: 600; }

  .err { font-family: var(--sans); font-size: 11.5px; color: var(--down); text-align: left; }

  footer { margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--line);
           font-size: 11.5px; color: var(--dimmer); line-height: 1.65; }
  footer b { color: var(--dim); font-weight: 500; }

  .loading, .fatal { font-family: var(--mono); font-size: 12.5px; color: var(--dim); padding: 40px 0; }
  .fatal { color: var(--down); }

  @media (max-width: 640px) {
    body { padding: 18px 12px 48px; }
    .stamp { margin-left: 0; width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Capex flow</h1>
    <span class="sub">where hyperscaler spend lands</span>
    <div class="stamp" id="stamp">loading…</div>
  </header>

  <div id="body">
    <div class="loading">Fetching data.json…</div>
  </div>

  <footer id="foot"></footer>
</div>

<script>
(function () {
  "use strict";

  var D = null;                 // the loaded payload
  var relPeriod = "30d";        // which period the vs-benchmark column uses
  var sort = { key: null, dir: "desc" };

  var PERIODS = [
    { key: "1d",  label: "Daily" },
    { key: "7d",  label: "7D"    },
    { key: "14d", label: "14D"   },
    { key: "30d", label: "30D"   },
    { key: "1y",  label: "1Y"    }
  ];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function sgn(v, dp) {
    if (v === null || v === undefined) return '<span class="na">–</span>';
    var cls = v > 0 ? "up" : v < 0 ? "down" : "";
    return '<span class="' + cls + '">' + (v > 0 ? "+" : "") + v.toFixed(dp === undefined ? 1 : dp) + "</span>";
  }

  function big(v) {
    if (v === null || v === undefined) return '<span class="na">–</span>';
    if (v >= 1e12) return (v / 1e12).toFixed(2) + "T";
    if (v >= 1e9)  return (v / 1e9).toFixed(1) + "B";
    if (v >= 1e6)  return (v / 1e6).toFixed(1) + "M";
    if (v >= 1e3)  return (v / 1e3).toFixed(1) + "K";
    return v.toFixed(0);
  }

  function price(r) {
    var s = r.last.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (r.currency && r.currency !== "USD") s += ' <span class="fx">' + esc(r.currency) + "</span>";
    return s;
  }

  /* ------------------------------------------------------------ umbrella
     Laid out from the same tree the table uses, so adding a ticker to
     tickers.json puts it in both places. Chips are tinted by the daily move,
     which turns the structure into a live read on where money moved today. */

  var CHIP_H = 19, CHIP_GAP = 3, PAD = 8, HEAD = 20;
  var LEAF_W = 148, COL_GAP = 12, LEVEL_GAP = 40;

  function boxHeight(node) {
    var n = (node.tickers || []).length;
    return HEAD + (n ? n * CHIP_H + (n - 1) * CHIP_GAP + 6 : 0) + PAD;
  }

  function measure(node) {
    node._h = boxHeight(node);
    var kids = node.children || [];
    if (!kids.length) { node._w = LEAF_W; return node._w; }
    var total = 0;
    kids.forEach(function (k, i) { total += measure(k) + (i ? COL_GAP : 0); });
    node._w = Math.max(LEAF_W, total);
    return node._w;
  }

  function place(node, x, depth, rows) {
    node._depth = depth;
    rows[depth] = Math.max(rows[depth] || 0, node._h);
    var kids = node.children || [];
    if (!kids.length) { node._cx = x + node._w / 2; return; }
    var span = 0;
    kids.forEach(function (k, i) { span += k._w + (i ? COL_GAP : 0); });
    var cx = x + node._w / 2, cursor = cx - span / 2;
    kids.forEach(function (k) { place(k, cursor, depth + 1, rows); cursor += k._w + COL_GAP; });
    node._cx = cx;
  }

  function chipColour(v) {
    if (v === null || v === undefined) return { fill: "#232a38", text: "var(--dim)" };
    var mag = Math.min(Math.abs(v) / 4, 1);              // saturate at 4%
    var a = (0.10 + mag * 0.42).toFixed(3);
    return v >= 0
      ? { fill: "rgba(127,176,105," + a + ")", text: "var(--up)" }
      : { fill: "rgba(201,112,100," + a + ")", text: "var(--down)" };
  }

  function drawNode(node, tops) {
    var w = Math.max(LEAF_W, (node.tickers || []).length ? LEAF_W : LEAF_W);
    var x = node._cx - w / 2, y = tops[node._depth], h = node._h;
    var isRoot = node._depth === 0;
    var s = '<g><rect class="node-box' + (isRoot ? " rt" : "") + '" x="' + x + '" y="' + y +
      '" width="' + w + '" height="' + h + '" rx="4"/>';
    s += '<text class="node-title" x="' + (x + 9) + '" y="' + (y + 14) + '">' +
      esc(node.name).toUpperCase() + "</text>";
    if (node.note) {
      s += '<text class="node-sub" x="' + (x + w - 9) + '" y="' + (y + 14) +
        '" text-anchor="end">' + esc(node.note) + "</text>";
    }
    (node.tickers || []).forEach(function (t, i) {
      var r = D.prices[t.symbol] || {};
      var v = r.status === "ok" && r.ret ? r.ret["1d"] : null;
      var c = chipColour(r.status === "ok" ? v : null);
      var cy = y + HEAD + 4 + i * (CHIP_H + CHIP_GAP);
      s += '<rect x="' + (x + 7) + '" y="' + cy + '" width="' + (w - 14) +
        '" height="' + CHIP_H + '" rx="2.5" fill="' + c.fill + '"/>';
      s += '<text class="chip-sym" x="' + (x + 13) + '" y="' + (cy + 13.5) + '">' +
        esc(t.symbol) + "</text>";
      var txt = r.status !== "ok" ? "n/a"
        : v === null || v === undefined ? "–"
        : (v > 0 ? "+" : "") + v.toFixed(1);
      s += '<text class="chip-pct" x="' + (x + w - 13) + '" y="' + (cy + 13.5) +
        '" text-anchor="end" fill="' + c.text + '">' + txt + "</text>";
    });
    s += "</g>";
    (node.children || []).forEach(function (k) { s += drawNode(k, tops); });
    return s;
  }

  function drawEdges(node, tops) {
    var s = "", kids = node.children || [];
    if (!kids.length) return s;
    var y0 = tops[node._depth] + node._h;
    kids.forEach(function (k) {
      var y1 = tops[k._depth], mid = y0 + (y1 - y0) / 2;
      s += '<path class="edge" d="M' + node._cx + ' ' + y0 +
        ' C' + node._cx + ' ' + mid + ' ' + k._cx + ' ' + mid + ' ' + k._cx + ' ' + y1 + '"/>';
      s += drawEdges(k, tops);
    });
    return s;
  }

  function umbrella() {
    var root = D.tree;
    measure(root);
    var rowH = [];
    place(root, 0, 0, rowH);
    var tops = [], acc = 0;
    for (var i = 0; i < rowH.length; i++) { tops[i] = acc; acc += rowH[i] + LEVEL_GAP; }
    var H = acc - LEVEL_GAP + 4, W = root._w;
    return '<div id="umbrella"><svg width="' + W + '" height="' + H +
      '" viewBox="0 0 ' + W + " " + H + '" role="img" ' +
      'aria-label="Hyperscaler capex flowing into memory and compute sectors">' +
      drawEdges(root, tops) + drawNode(root, tops) + "</svg></div>";
  }

  /* ----------------------------------------------------------------- table */

  function flatten(node, depth, out) {
    if ((node.tickers || []).length) {
      out.push({ group: node.name, syms: node.tickers.map(function (t) { return t.symbol; }) });
    }
    (node.children || []).forEach(function (k) { flatten(k, depth + 1, out); });
    return out;
  }

  function cols() {
    var c = [{ key: "symbol", label: "", plain: false }, { key: "last", label: "Price" }];
    PERIODS.forEach(function (p) { c.push({ key: "ret." + p.key, label: p.label }); });
    c.push({ key: "volume", label: "Volume" });
    c.push({ key: "mcap", label: "Mkt cap" });
    c.push({ key: "rel." + relPeriod, label: "vs " + D.benchmark });
    return c;
  }

  function valueOf(r, key) {
    if (key.indexOf(".") < 0) return r[key];
    var p = key.split(".");
    return (r[p[0]] || {})[p[1]];
  }

  function cell(col, r) {
    if (col.key === "symbol") {
      return '<td class="sym"><span class="ticker">' + esc(r.symbol) +
        '</span><span class="co">' + esc(r.name) + "</span></td>";
    }
    if (col.key === "last")   return "<td>" + price(r) + "</td>";
    if (col.key === "volume") return "<td>" + big(r.volume) + "</td>";
    if (col.key === "mcap")   return "<td>" + (r.mcap ? "$" + big(r.mcap) : '<span class="na">–</span>') + "</td>";
    if (col.key.indexOf("rel.") === 0) {
      var v = valueOf(r, col.key);
      return '<td class="rel">' + sgn(v) + "</td>";
    }
    return "<td>" + sgn(valueOf(r, col.key)) + "</td>";
  }

  function table() {
    var groups = flatten(D.tree, 0, []);
    var C = cols();

    var head = C.map(function (c) {
      var arr = sort.key === c.key ? '<span class="arrow">' + (sort.dir === "asc" ? "▲" : "▼") + "</span>" : "";
      return '<th tabindex="0" data-k="' + c.key + '">' + esc(c.label) + arr + "</th>";
    }).join("");

    var body = "";
    groups.forEach(function (g) {
      var rows = g.syms.map(function (s) { return D.prices[s]; }).filter(Boolean);
      if (sort.key) {
        var ok = rows.filter(function (r) { return r.status === "ok"; });
        var bad = rows.filter(function (r) { return r.status !== "ok"; });
        var dir = sort.dir === "asc" ? 1 : -1;
        ok.sort(function (a, b) {
          var x = valueOf(a, sort.key), y = valueOf(b, sort.key);
          if (x === null || x === undefined) return 1;
          if (y === null || y === undefined) return -1;
          if (typeof x === "string") return dir * x.localeCompare(y);
          return dir * (x - y);
        });
        rows = ok.concat(bad);
      }
      body += '<tr class="grp"><td colspan="' + C.length + '">' + esc(g.group) + "</td></tr>";
      rows.forEach(function (r) {
        if (r.status !== "ok") {
          body += '<tr class="row"><td class="sym"><span class="ticker">' + esc(r.symbol) +
            '</span><span class="co">' + esc(r.name) + '</span></td><td class="err" colspan="' +
            (C.length - 1) + '">no data — ' + esc(r.error) + "</td></tr>";
          return;
        }
        body += '<tr class="row">' + C.map(function (c) { return cell(c, r); }).join("") + "</tr>";
      });
    });

    var seg = PERIODS.map(function (p) {
      return '<button data-p="' + p.key + '" aria-pressed="' + (relPeriod === p.key) + '">' +
        p.label + "</button>";
    }).join("");

    return '<h2>Data</h2><div class="h2note">Sorting applies within each bucket. ' +
      'Click a column header.</div>' +
      '<div class="controls"><span>vs ' + esc(D.benchmark) + ' over</span><span class="seg">' +
      seg + "</span></div>" +
      '<div class="scroller"><table><thead><tr>' + head +
      "</tr></thead><tbody>" + body + "</tbody></table></div>";
  }

  /* ------------------------------------------------------------------ wire */

  function render() {
    document.getElementById("body").innerHTML =
      '<h2>Where the money flows</h2>' +
      '<div class="h2note">Chips shaded by today\'s move. Structure reads top-down: ' +
      'hyperscaler capex into memory and compute.</div>' +
      umbrella() + table();
  }

  document.addEventListener("click", handle);
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") handle(e);
  });

  function handle(e) {
    if (!e.target.closest) return;
    var b = e.target.closest("button[data-p]");
    if (b) {
      e.preventDefault();
      relPeriod = b.getAttribute("data-p");
      if (sort.key && sort.key.indexOf("rel.") === 0) sort.key = "rel." + relPeriod;
      render();
      return;
    }
    var th = e.target.closest("th[data-k]");
    if (th) {
      e.preventDefault();
      var k = th.getAttribute("data-k");
      sort = { key: k, dir: sort.key === k && sort.dir === "desc" ? "asc" : "desc" };
      render();
    }
  }

  fetch("data.json?t=" + Date.now())
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (d) {
      D = d;
      var stale = "";
      var gen = new Date(d.generated_utc.replace(" ", "T") + ":00Z");
      if ((Date.now() - gen.getTime()) / 3.6e6 > 30) stale = " · <span style='color:#c97064'>stale</span>";
      document.getElementById("stamp").innerHTML =
        "updated <b>" + esc(d.generated_bkk) + "</b> ICT" + stale;
      render();
      document.getElementById("foot").innerHTML =
        "<b>Daily closes only</b> — not live quotes. The page is static; it shows whatever the last " +
        "scheduled run wrote, and redraws when you reload.<br>" +
        "Periods are calendar days, so 7D is a week ago, not seven sessions. " +
        "Returns are price only, excluding dividends. " +
        "<b>vs " + esc(d.benchmark) + "</b> is the ticker's return minus " + esc(d.benchmark) +
        "'s over the same window — positive means it outpaced the sector.<br>" +
        "<b>Market cap</b> is price × a share count kept manually in tickers.json; " +
        "free price feeds don't publish share counts, so it drifts with buybacks and issuance. " +
        "Foreign listings are converted to USD at spot; their prices stay in local currency.";
    })
    .catch(function (err) {
      document.getElementById("body").innerHTML =
        '<div class="fatal">Could not load data.json — ' + esc(err.message) +
        ".<br>If the site just went up, check the fetch workflow has run at least once.</div>";
    });
})();
</script>
</body>
</html>
